
<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>المكتبة - BookSwap</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand"><div class="logo">BS</div><div><div style="font-weight:700">BookSwap</div><div class="small">تبادل الكتب</div></div></div>
    <nav><a href="home.html">الرئيسية</a><a href="how.html">كيف يعمل</a><a href="library.html">المكتبة</a><a href="add.html">أضف كتاب</a></nav>
  </header>

  <section>
    <div style="display:flex;gap:12px;align-items:center">
      <input id="searchInput" placeholder="ابحث عن كتاب أو مؤلف..." class="input" style="max-width:420px"/>
      <a class="btn" href="add.html">أضف كتاب</a>
    </div>

    <div id="libraryGrid" class="grid" style="margin-top:16px"></div>
  </section>

  <div class="footer"> 2025 by Ansam</div>
</div>


<div id="modal" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:12px;padding:18px;max-width:720px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.3)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 class="modal-title">تفاصيل الكتاب</h3>
      <button id="modalClose" class="btn secondary">إغلاق</button>
    </div>
    <div class="modal-body" style="margin-top:12px"></div>
  </div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
