<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - BookShwap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body {
      background: #f3e8ff; 
    }
    .card {
      border-radius: 20px;
      background: #fff;
    }
    .form-control:focus {
      border-color: #a855f7;
      box-shadow: 0 0 5px rgba(168,85,247,0.5);
    }
    .btn-success {
      background-color: #a855f7;
      border: none;
    }
    .btn-success:hover {
      background-color: #9333ea;
    }
  </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow w-100" style="max-width:450px;">
    <h3 class="text-center mb-4">أنشئ حسابك الجديد</h3>
    <form id="signupForm">
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
        <input type="text" class="form-control" id="name" placeholder="الاسم الكامل" required>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
        <input type="email" class="form-control" id="email" placeholder="البريد الإلكتروني" required>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" class="form-control" id="password" placeholder="كلمة المرور" required minlength="6">
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" class="form-control" id="confirmPassword" placeholder="تأكيد كلمة المرور" required minlength="6">
      </div>
      <button type="submit" class="btn btn-success w-100">إنشاء الحساب</button>
    </form>
    <p class="mt-3 text-center">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="signupToast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body">
         تم إنشاء الحساب بنجاح، سيتم نقلك الآن..
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
$("#signupForm").on("submit", function(e){
  e.preventDefault();
  let pass = $("#password").val();
  let confirm = $("#confirmPassword").val();
  if(pass !== confirm){
    alert("كلمات المرور غير متطابقة ");
  } else {
    let toast = new bootstrap.Toast(document.getElementById("signupToast"));
    toast.show();
    setTimeout(() => {
      window.location.href = "index.html";
    }, 2000);
  }
});
</script>
</body>
</html>
