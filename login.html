<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - BookSwap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body {
      background: #f3e8ff;
    }
    .card {
      border-radius: 20px;
      background: #fff;
    }
    .form-control:focus {
      border-color: #a855f7;
      box-shadow: 0 0 5px rgba(168,85,247,0.5);
    }
    .btn-primary {
      background-color: #a855f7;
      border: none;
    }
    .btn-primary:hover {
      background-color: #9333ea;
    }
  </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow w-100" style="max-width:400px;">
    <h3 class="text-center mb-4 text-purple">مرحبا بعودتك </h3>
    <form id="loginForm">
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
        <input type="email" class="form-control" id="email" placeholder="البريد الإلكتروني" required>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" class="form-control" id="password" placeholder="كلمة المرور" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100">تسجيل الدخول</button>
    </form>
    <p class="mt-3 text-center">ليس لديك حساب؟ <a href="signup.html">إنشاء حساب</a></p>
  </div>
</div>


<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body">
        ✅ تم تسجيل الدخول بنجاح، سيتم نقلك الآن...
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
$("#loginForm").on("submit", function(e){
  e.preventDefault();
  let email = $("#email").val().trim();
  let pass = $("#password").val().trim();
  if(email === "" || pass === ""){
    alert("الرجاء إدخال جميع البيانات");
  } else {
    let toast = new bootstrap.Toast(document.getElementById("successToast"));
    toast.show();
    setTimeout(() => {
      window.location.href = "index.html";
    }, 2000);
  }
});
</script>
</body>
</html>
