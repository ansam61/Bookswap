
<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BookSwap - تبادل الكتب</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand">
      <div class="logo">BS</div>
      <div>
        <div style="font-weight:700">BookSwap</div>
        <div class="small">تبادل الكتب بدون شراء</div>
      </div>
    </div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="how.html">كيف يعمل</a>
      <a href="library.html">المكتبة</a>
      <a href="add.html">أضف كتاب</a>
      <a href="stories.html">قصص</a>
      <a href="contact.html">تواصل</a>
    </nav>
  </header>

  <section class="hero">
    <div class="left">
      <h1>شارك كتبك — اقرأ مجانا</h1>
      <p>منصة بسيطة لتبادل الكتب بين الناس في منطقتك. أضف كتابك، وتابع المكتبة، وتواصل مع صاحب الكتاب.</p>
      <div style="margin-top:12px">
        <a class="cta" href="add.html">أضف كتاب الآن</a>
        <a class="cta" href="library.html" style="background:#6B2E8A;margin-left:8px">تصفح المكتبة</a>
      </div>
    </div>
    <div style="width:300px">
      <img src="assets/images/cover1.svg" style="width:100%;border-radius:12px"/>
    </div>
  </section>

  <h2 style="margin-top:18px">أحدث الإضافات</h2>
  <div id="latestGrid" class="grid">
    <!-- يتم تعبئتها من localStorage -->
  </div>

  <div class="footer">
     2025 by Ansam — حرصًا على تبادل المعرفة
  </div>
</div>


<div id="modal" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:12px;padding:18px;max-width:720px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.3)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 class="modal-title">تفاصيل الكتاب</h3>
      <button id="modalClose" class="btn secondary">إغلاق</button>
    </div>
    <div class="modal-body" style="margin-top:12px"></div>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script>
function populateLatest(){
  try{
    const raw = localStorage.getItem('bookswap_books_v1') || '[]';
    const books = JSON.parse(raw);
    const g = document.getElementById('latestGrid');
    if(!g) return;
    g.innerHTML = books.slice(0,6).map(function(b){
      return '<div class="card"><img src="'+b.cover+'"><div><strong>'+b.title+'</strong></div><div class="small">المؤلف: '+b.author+'</div><div style="margin-top:auto"><a class="btn" href="library.html">عرض</a></div></div>';
    }).join('');
  }catch(e){}
}
document.addEventListener('DOMContentLoaded', populateLatest);
</script>
</body>
</html>
